<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Framer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>Prompt Framer</h1>
      <nav class="help-links" aria-label="Help links">
        <a class="help-link" href="/help.html">Quick Mode Help</a>
        <a class="help-link" href="/workflow-help.html">Software Blueprinting</a>
      </nav>
    </div>
    <p class="subtitle">Select your architecture framework and feed subjects to generate optimized standalone Super Prompts.</p>

    <div class="key-panel">
      <label for="api-provider-select">API Provider</label>
      <select id="api-provider-select">
        <option value="gemini" selected>Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic Claude</option>
        <option value="openrouter">OpenRouter</option>
        <option value="groq">Groq</option>
        <option value="mistral">Mistral AI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="xai">xAI Grok</option>
        <option value="ollama">Ollama (Local)</option>
        <option value="lmstudio">LM Studio (Local)</option>
        <option value="openai-compatible">Custom OpenAI-compatible API</option>
      </select>
      <label for="api-key-input">Custom API Key Override (Optional)</label>
       <p class="helper-text" id="api-key-help">Paste a Gemini API key from Google AI Studio. OAuth access tokens are not supported.</p>
      <div id="openai-settings" hidden>
        <label for="api-base-url">API Base URL</label>
        <input type="url" id="api-base-url" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1">
        <label for="api-model">Model</label>
        <input type="text" id="api-model" value="gpt-4o-mini" placeholder="e.g., gpt-4o-mini">
      </div>
      <div class="key-row">
        <input type="password" id="api-key-input" placeholder="Paste your Google AI Studio API key">
        <button class="btn" id="save-key-btn">Apply API Key</button>
      </div>
      <div id="key-status-msg" class="status-message" aria-live="polite"></div>
    </div>

    <div class="workflow-panel">
      <label for="prompt-mode">Prompt Mode</label>
      <select id="prompt-mode">
        <option value="quick" selected>Quick Prompt</option>
        <option value="iterative">Software Blueprinting</option>
      </select>

      <div id="iterative-panel" class="iterative-panel" hidden>
        <label for="project-name">Project Name</label>
        <input type="text" id="project-name" placeholder="e.g., Photocraft">
        <label for="project-summary">Project Summary</label>
        <textarea id="project-summary" rows="3" placeholder="Describe the product and its intended users."></textarea>
        <label for="project-stack">Technology Stack</label>
        <textarea id="project-stack" rows="2" placeholder="One item per line: TypeScript, Canvas, WebGL"></textarea>
        <label for="project-modules">Architecture Modules</label>
        <textarea id="project-modules" rows="2" placeholder="One item per line: UI, engine, state, filters"></textarea>
        <label for="project-phases">Roadmap Phases</label>
        <textarea id="project-phases" rows="2" placeholder="One item per line: Foundation, Tools, History"></textarea>
        <label for="project-constraints">Coding Constraints</label>
        <textarea id="project-constraints" rows="2" placeholder="One item per line: strict TypeScript, no placeholders"></textarea>
        <button class="btn btn-secondary" id="save-blueprint-btn" type="button">Save Blueprint</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="framework">Framework Strategy</label>
        <select id="framework">
          <option value="RACE" selected>RACE (Role, Action, Context, Expectation)</option>
          <option value="RISE">RISE (Role, Instructions/Issue, Steps, Expectation/Example)</option>
          <option value="STAR">STAR (Situation, Task, Action, Result)</option>
          <option value="SOAP">SOAP (Subject, Objective, Action, Plan)</option>
          <option value="APE">APE (Action, Purpose, Expectation)</option>
          <option value="ERA">ERA (Expectation, Role, Action)</option>
          <option value="BAB">BAB (Before, After, Bridge)</option>
          <option value="TAG">TAG (Task, Action, Goal)</option>
          <option value="RTF">RTF (Role, Task, Format)</option>
          <option value="SOP">SOP (Schema, Operations, Proof)</option>
          <option value="DEV">DEV (Discovery, Engineering, Verification)</option>
          <option value="AGT">AGT (Aim, Guardrails, Tools, Workflow)</option>
          <option value="RAG">RAG (Request, Authorities, Grounding)</option>
          <option value="STORY">STORY (Situation, Tension, Outline, Roles, Yield)</option>
          <option value="RTF-3D">RTF-3D (Interactive Three.js Extension)</option>
          <option value="IPB">IPB (Intent, Palette, Build, Materials, Typography, Boundaries)</option>
          <option value="VSB">VSB (Vision, Subjects, Blocks, Behavior, Boundaries)</option>
        </select>
      </div>

      <div>
        <label for="subject">Core Subject / Topic Context (Max 200 Chars)</label>
        <input type="text" id="subject" maxlength="200" placeholder="e.g., marketing archetypes, python code refactoring">
      </div>
    </div>

    <div id="iterative-task-panel" class="iterative-panel" hidden>
      <label for="task-phase">Current Phase</label>
      <input type="text" id="task-phase" placeholder="e.g., Phase 1: Foundation">
      <label for="task-title">Task Title</label>
      <input type="text" id="task-title" placeholder="e.g., Create the canvas layer manager">
      <label for="task-description">Task Description</label>
      <textarea id="task-description" rows="4" placeholder="Describe the exact implementation task."></textarea>
      <label for="task-files">Target Files</label>
      <textarea id="task-files" rows="2" placeholder="One file per line"></textarea>
      <label for="task-criteria">Acceptance Criteria</label>
      <textarea id="task-criteria" rows="3" placeholder="One criterion per line"></textarea>
    </div>

    <button class="btn" id="generate-btn">Generate Super Prompt</button>

    <div class="output-box" id="output-container">
      <div class="output-header">
        <label>Generated Workspace Output</label>
        <button class="btn btn-small" id="copy-btn">Copy Prompt</button>
      </div>
      <pre id="output-display"></pre>
      <div class="enhancement-panel">
        <label for="enhancement-input">Optional Enhancement Instructions</label>
        <textarea id="enhancement-input" rows="3" placeholder="e.g., add stronger validation, improve the shot timing, or make the implementation more production-ready"></textarea>
        <button class="btn" id="enhance-btn">Enhance Super Prompt</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/iterative.js"></script>
</body>
</html>
